<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5S Shine Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pri:#0A2868;
    --pri-dark:#061a45;
    --pri-light:#e7ecf6;
    --ink:#20262b;
    --paper:#f2f5f5;
    --card:#ffffff;
    --line:#d7dee0;
    --muted:#5f6b70;
    --ok:#1f9d55;
    --bad:#d64545;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Archivo',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
  .topbar{
    background:var(--pri);color:#fff;
    padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .backbtn{background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;
           border-radius:50%;font-size:1.2rem;cursor:pointer;flex:0 0 auto;display:none}
  .brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .brand img{height:32px;max-width:120px;object-fit:contain;display:none}
  .brand .txt{min-width:0}
  .brand .co{font-weight:800;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  .brand .ttl{font-weight:700;font-size:1.05rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
  .screen{display:none}
  .screen.show{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hero{background:linear-gradient(160deg,var(--pri) 0%,var(--pri-dark) 100%);color:#fff;
        border-radius:var(--radius);padding:28px 22px;margin-bottom:18px}
  .hero h2{font-size:1.5rem;font-weight:800;line-height:1.25;margin-bottom:6px}
  .hero p{opacity:.85;font-size:.9rem}
  .menu{display:flex;flex-direction:column;gap:12px}
  .menubtn{display:flex;align-items:center;justify-content:space-between;font:inherit;font-weight:700;
           font-size:1.05rem;background:var(--card);color:var(--pri);border:1.5px solid var(--line);
           border-radius:var(--radius);padding:18px 20px;cursor:pointer;min-height:60px;
           transition:transform .06s ease}
  .menubtn:active{transform:scale(.98)}
  .menubtn .arrow{font-weight:800}
  .menubtn.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
  .prompt{font-weight:700;font-size:1.15rem;margin:4px 2px 14px}
  .catbtn{display:block;width:100%;font:inherit;font-weight:700;font-size:1.05rem;background:var(--card);
          color:var(--pri);border:1.5px solid var(--line);border-radius:var(--radius);
          padding:22px 16px;margin-bottom:10px;cursor:pointer;text-align:center;transition:transform .06s ease}
  .catbtn:active{transform:scale(.98)}
  .catbtn small{display:block;color:var(--muted);font-weight:500;font-size:.8rem;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(32,38,43,.04)}
  label.fl{display:block;font-weight:700;font-size:.8rem;color:var(--pri);text-transform:uppercase;
           letter-spacing:.06em;margin-bottom:6px}
  label.fl .req{color:var(--bad)}
  input[type=text], textarea, select{width:100%;font:inherit;font-size:1rem;padding:12px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);
    box-shadow:0 0 0 3px rgba(10,40,104,.15)}
  input[readonly]{background:var(--pri-light);font-weight:600}
  textarea{resize:vertical;min-height:80px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:420px){.row2{grid-template-columns:1fr}}
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .toggle button{font:inherit;font-weight:700;padding:12px 0;min-height:46px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer}
  .toggle button.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .sec{font-weight:800;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pri);
       margin:20px 2px 10px;display:flex;align-items:center;gap:10px}
  .sec::after{content:"";flex:1;height:2px;background:var(--line)}
  .qtext{font-weight:600;font-size:.98rem;line-height:1.45;margin-bottom:10px}
  .qnum{color:var(--pri);font-weight:800;margin-right:4px}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .yn button{font:inherit;font-weight:700;font-size:.95rem;padding:12px 0;min-height:46px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer;
    transition:transform .06s ease}
  .yn button:active{transform:scale(.97)}
  .yn button.yes.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .yn button.no.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opts button{font:inherit;font-weight:600;font-size:.9rem;padding:11px 16px;min-height:44px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer}
  .opts button.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .qcomment{display:none;margin-top:8px}
  .qcomment.show{display:block}
  .photobar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .addphoto{width:72px;height:72px;border:2px dashed var(--pri);border-radius:10px;
    background:var(--pri-light);color:var(--pri);font-size:1.6rem;font-weight:700;cursor:pointer}
  .thumb{position:relative;width:72px;height:72px}
  .thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .thumb .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
    border:none;background:var(--bad);color:#fff;font-size:.75rem;font-weight:800;cursor:pointer;line-height:1}
  .filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .filechip{display:flex;align-items:center;gap:8px;background:var(--pri-light);color:var(--pri);
    font-weight:600;font-size:.85rem;padding:8px 10px;border-radius:8px}
  .filechip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filechip button{border:none;background:var(--pri);color:#fff;width:22px;height:22px;border-radius:50%;
    font-size:.65rem;font-weight:800;cursor:pointer;flex:0 0 auto}
  .attachbtn{font:inherit;font-weight:700;font-size:.9rem;background:none;border:1.5px dashed var(--pri);
    color:var(--pri);border-radius:10px;padding:11px 16px;cursor:pointer;width:100%;margin-top:10px}
  .submit{width:100%;font:inherit;font-weight:800;font-size:1.1rem;padding:16px 0;min-height:54px;
    border:none;border-radius:12px;margin-top:16px;background:#c4ccce;color:#7b8589;cursor:not-allowed}
  .submit.ready{background:var(--pri);color:#fff;cursor:pointer}
  .hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}
  .entry{border-left:4px solid var(--pri);padding-left:12px}
  .entry .e1{font-weight:700}
  .entry .e2{font-size:.85rem;color:var(--muted);margin-top:2px}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:.95rem}
  .dnote{font-size:.78rem;color:var(--muted);margin-bottom:10px;line-height:1.4}
  .legend{display:flex;gap:14px;margin-bottom:10px;font-size:.8rem;font-weight:600}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
  .dtile{border-radius:10px;padding:12px 10px;color:#fff;font-weight:700;font-size:.85rem;
         line-height:1.3;min-height:60px}
  .dtile.ok{background:var(--ok)}
  .dtile.miss{background:var(--bad)}
  .dtile small{display:block;font-weight:500;font-size:.72rem;opacity:.9;margin-top:4px}
  .done-icon{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:2.2rem;
    display:flex;align-items:center;justify-content:center;margin:20px auto 14px}
  .done-h{font-weight:800;font-size:1.3rem;text-align:center;margin-bottom:8px}
  .done-p{color:var(--muted);text-align:center;font-size:.92rem;line-height:1.5;margin-bottom:16px}
  pre.report{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-size:.78rem;white-space:pre-wrap;word-break:break-word;max-height:38vh;overflow:auto;margin-bottom:12px}
  .btn{display:block;width:100%;font:inherit;font-weight:700;font-size:1rem;padding:14px;
    border-radius:12px;border:1.5px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;
    margin-bottom:10px;min-height:50px}
  .btn.ghost{background:#fff;color:var(--pri)}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <button class="backbtn" id="backBtn" aria-label="Back">‹</button>
  <div class="brand">
    <img id="logoImg" alt="">
    <div class="txt">
      <div class="co" id="coName"></div>
      <div class="ttl" id="appTitle"></div>
    </div>
  </div>
</div>

<main>
  <section class="screen" id="scr-home">
    <div class="hero"><h2 id="heroTitle"></h2><p id="heroDate"></p></div>
    <div class="menu" id="homeMenu"></div>
  </section>

  <section class="screen" id="scr-loc">
    <div class="prompt">Select your area</div>
    <div id="locList"></div>
  </section>

  <section class="screen" id="scr-cat">
    <div class="prompt">Please select a category</div>
    <div id="catList"></div>
  </section>

  <section class="screen" id="scr-form">
    <div class="prompt" id="formTitle"></div>
    <div class="card">
      <div class="row2">
        <div>
          <label class="fl">Employee ID <span class="req">*</span></label>
          <input type="text" id="empId" placeholder="e.g. SG12345" autocomplete="off">
        </div>
        <div>
          <label class="fl">Area Responsible</label>
          <input type="text" id="areaResp" placeholder="Name (optional)" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="card">
      <label class="fl">Area / Location <span class="req">*</span></label>
      <input type="text" id="areaLoc" list="areaOptions" placeholder="Select or type" autocomplete="off">
      <datalist id="areaOptions"></datalist>
    </div>
    <div class="card">
      <label class="fl">Shift <span class="req">*</span></label>
      <div class="toggle" id="shiftToggle">
        <button type="button" data-v="Day">☀ Day</button>
        <button type="button" data-v="Night">☾ Night</button>
      </div>
    </div>
    <div class="sec">Checklist</div>
    <div id="qList"></div>
    <div id="photoSec">
      <div class="sec">Photos</div>
      <div class="card">
        <label class="fl">Attach photos (camera or gallery)</label>
        <div class="photobar" id="photoBar">
          <button type="button" class="addphoto" id="addPhotoBtn" aria-label="Add photo">＋</button>
        </div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" multiple hidden>
      </div>
    </div>
    <div id="fileSec">
      <div class="sec">Files</div>
      <div class="card">
        <label class="fl">Attach documents (optional)</label>
        <div class="filelist" id="fileList"></div>
        <button type="button" class="attachbtn" id="addFileBtn">＋ Attach file</button>
        <input type="file" id="fileInput" multiple hidden>
      </div>
    </div>
    <div class="sec">Remarks</div>
    <div class="card">
      <textarea id="remarks" placeholder="Any other observations (optional)"></textarea>
    </div>
    <button class="submit" id="submitBtn" disabled>Complete required fields</button>
    <div class="hint" id="submitHint"></div>
  </section>

  <section class="screen" id="scr-entries">
    <div class="prompt">Today's entries on this device</div>
    <div id="entryList"></div>
  </section>

  <section class="screen" id="scr-dash">
    <div class="prompt">Dashboard — <span id="dashDate"></span></div>
    <div class="dnote">Shows submissions made from THIS device only. The full team view is in your SharePoint list.</div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>Checked today</span>
      <span><i style="background:var(--bad)"></i>Not checked</span>
    </div>
    <div class="dgrid" id="dashGrid"></div>
    <div class="sec">Submission log</div>
    <div id="dashLog"></div>
    <button class="btn ghost" id="csvBtn">Export log to Excel (CSV)</button>
  </section>

  <section class="screen" id="scr-done">
    <div class="done-icon">✓</div>
    <div class="done-h">Report ready to send</div>
    <div class="done-p" id="doneMsg"></div>
    <pre class="report" id="reportOut"></pre>
    <button class="btn" id="shareAgainBtn">Send / Share again</button>
    <button class="btn ghost" id="copyBtn">Copy report text</button>
    <button class="btn ghost" onclick="location.reload()">New check</button>
  </section>
</main>

function shade(hex,p){
  var n = hex.replace("#","");
  if (n.length===3){ n = n.split("").map(function(c){return c+c;}).join(""); }
  var r=parseInt(n.substr(0,2),16), g=parseInt(n.substr(2,2),16), b=parseInt(n.substr(4,2),16);
  var t = p<0 ? 0 : 255, q = Math.abs(p);
  r=Math.round((t-r)*q)+r; g=Math.round((t-g)*q)+g; b=Math.round((t-b)*q)+b;
  return "rgb("+r+","+g+","+b+")";
}

function startForm(cat){
  state.category = cat;
  state.answers = cat.questions.map(function(){return null;});
  state.comments = cat.questions.map(function(){return "";});
  state.shift = null;
  state.photos.forEach(function(p){URL.revokeObjectURL(p.url);});
  state.photos = []; state.docs = [];
  document.getElementById("formTitle").textContent = cat.name;
  document.getElementById("empId").value = "";
  document.getElementById("areaResp").value = "";
  var al = document.getElementById("areaLoc");
  if (CONFIG.flow.locationPage){ al.value = state.area || ""; al.readOnly = true; }
  else { al.value = ""; al.readOnly = false; }
  document.getElementById("remarks").value = "";
  document.querySelectorAll("#shiftToggle button").forEach(function(b){b.classList.remove("on");});
  renderPhotos(); renderFiles();

  qList.innerHTML = "";
  cat.questions.forEach(function(q,i){
    var card = document.createElement("div");
    card.className = "card";
    var qt = document.createElement("div");
    qt.className = "qtext";
    var num = document.createElement("span");
    num.className = "qnum"; num.textContent = String(i+1).padStart(2,"0");
    qt.appendChild(num); qt.append(q.text + (q.required ? " *" : ""));
    card.appendChild(qt);

    if (q.type === "yesno"){
      var yn = document.createElement("div"); yn.className = "yn";
      var yes = document.createElement("button"); yes.type="button"; yes.className="yes"; yes.textContent="Yes";
      var no  = document.createElement("button"); no.type="button";  no.className="no";  no.textContent="No";
      yn.appendChild(yes); yn.appendChild(no); card.appendChild(yn);
      var cbox = document.createElement("div"); cbox.className = "qcomment";
      var ci = document.createElement("input"); ci.type="text"; ci.placeholder="Comment - what is the issue? (optional)";
      ci.oninput = function(){ state.comments[i] = ci.value.trim(); };
      cbox.appendChild(ci); card.appendChild(cbox);
      yes.onclick = function(){ state.answers[i]="Yes"; yes.classList.add("on"); no.classList.remove("on"); cbox.classList.remove("show"); refresh(); };
      no.onclick  = function(){ state.answers[i]="No";  no.classList.add("on");  yes.classList.remove("on"); cbox.classList.add("show"); refresh(); };
    } else if (q.type === "choice"){
      var op = document.createElement("div"); op.className = "opts";
      (q.options||[]).forEach(function(o){
        var b = document.createElement("button"); b.type="button"; b.textContent = o;
        b.onclick = function(){
          state.answers[i] = o;
          op.querySelectorAll("button").forEach(function(x){x.classList.toggle("on", x===b);});
          refresh();
        };
        op.appendChild(b);
      });
      card.appendChild(op);
    } else if (q.type === "short"){
      var si = document.createElement("input"); si.type="text"; si.placeholder="Your answer";
      si.oninput = function(){ state.answers[i] = si.value; refresh(); };
      card.appendChild(si);
    } else {
      var ta = document.createElement("textarea"); ta.placeholder="Your answer";
      ta.oninput = function(){ state.answers[i] = ta.value; refresh(); };
      card.appendChild(ta);
    }
    qList.appendChild(card);
  });
  refresh();
  go("form");
}

photoInput.onchange = async function(){

  }
  photoInput.value = "";

};
function renderPhotos(){
  var bar = document.getElementById("photoBar");
  bar.querySelectorAll(".thumb").forEach(function(t){t.remove();});
  state.photos.forEach(function(p,i){
    var t = document.createElement("div");
    t.className = "thumb";
    var im = document.createElement("img"); im.alt = "photo "+(i+1); im.src = p.url;
    var rm = document.createElement("button"); rm.type="button"; rm.className="rm"; rm.textContent="✕";
    rm.onclick = function(){ URL.revokeObjectURL(p.url); state.photos.splice(i,1); renderPhotos(); };
    t.appendChild(im); t.appendChild(rm);
    bar.appendChild(t);
  });
}
function compressImage(file){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var max = 1280, w = img.width, h = img.height;
      if (Math.max(w,h) > max){ var k = max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      var c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(function(b){
        resolve(new File([b], "photo_"+Date.now()+".jpg", {type:"image/jpeg"}));
        URL.revokeObjectURL(img.src);
      }, "image/jpeg", 0.72);
    };
    img.onerror = function(){ resolve(file); };
    img.src = URL.createObjectURL(file);
  });
}

    var c = document.createElement("div"); c.className = "filechip";
    var s = document.createElement("span"); s.textContent = f.name;
    var x = document.createElement("button"); x.type="button"; x.textContent="✕";
    x.onclick = function(){ state.docs.splice(i,1); renderFiles(); };
    c.appendChild(s); c.appendChild(x);
    l.appendChild(c);
  });
}

/* validation */
const submitBtn = document.getElementById("submitBtn");
function refresh(){
  if (!state.category) return;
  var empOk  = document.getElementById("empId").value.trim() !== "";
  var areaOk = document.getElementById("areaLoc").value.trim() !== "";
  var qOk = state.answers.every(function(a,i){
    var q = state.category.questions[i];
    if (!q.required) return true;
    return a !== null && String(a).trim() !== "";
  });
  var ready = empOk && areaOk && state.shift && qOk;
  submitBtn.disabled = !ready;
  submitBtn.classList.toggle("ready", ready);
  submitBtn.textContent = ready ? "Submit report" : "Complete required fields";
  document.getElementById("submitHint").textContent = ready ? "" :
    "Required: Employee ID, Area, Shift, and all questions marked *";
}

/* report */
function buildAnswerLines(){
  var arr = [];
  state.category.questions.forEach(function(q,i){
    var a = state.answers[i]===null ? "-" : String(state.answers[i]);
    var line = "Q"+(i+1)+": " + a;
    if (q.type==="yesno" && state.answers[i]==="No" && state.comments[i]) line += " | Comment: " + state.comments[i];
    arr.push({line:line, text:"Q"+(i+1)+"Text: "+q.text});
  });
  return arr;
}
function buildReport(){
  var L = [];
  L.push("=== 5S SHINE REPORT ===");
  L.push("Date: " + new Date().toISOString());
  L.push("Category: " + state.category.name);
  L.push("EmployeeID: " + document.getElementById("empId").value.trim());
  L.push("AreaResponsible: " + (document.getElementById("areaResp").value.trim() || "-"));
  L.push("Area: " + document.getElementById("areaLoc").value.trim());
  L.push("Shift: " + state.shift);
  buildAnswerLines().forEach(function(o){ L.push(o.line); L.push(o.text); });
  L.push("Photos: " + state.photos.length);
  L.push("Files: " + (state.docs.length ? state.docs.map(function(f){return f.name;}).join(", ") : "0"));
  L.push("Remarks: " + (document.getElementById("remarks").value.trim() || "-"));
  L.push("=== END ===");
  var data = {
    date: new Date().toISOString(),
    category: state.category.name,
    employeeId: document.getElementById("empId").value.trim(),
    areaResponsible: document.getElementById("areaResp").value.trim(),
    area: document.getElementById("areaLoc").value.trim(),
    shift: state.shift,
    answers: state.category.questions.map(function(q,i){
      return {q:q.text, a:state.answers[i], comment:state.comments[i]||""};
    }),
    photos: state.photos.length,
    files: state.docs.map(function(f){return f.name;}),
    remarks: document.getElementById("remarks").value.trim()
  };
  L.push("===DATA===");
  L.push(JSON.stringify(data));
  return L.join("\n");
}

submitBtn.onclick = async function(){
  if (submitBtn.disabled) return;
  var report = buildReport();
  var subject = CONFIG.emailSubject + " | " + state.category.name + " | " +
                document.getElementById("areaLoc").value.trim() + " | " +
                new Date().toLocaleDateString();
  try{
    var log = JSON.parse(localStorage.getItem("shine_log")||"[]");
    log.push({
      t: Date.now(),
      cat: state.category.name,
      area: document.getElementById("areaLoc").value.trim(),
      emp: document.getElementById("empId").value.trim(),
      shift: state.shift,
      no: state.answers.filter(function(a,i){return state.category.questions[i].type==="yesno" && a==="No";}).length,
      photos: state.photos.length,
      ans: state.category.questions.map(function(q,i){
        var a = state.answers[i]===null ? "-" : String(state.answers[i]);
        if (q.type==="yesno" && a==="No" && state.comments[i]) a += " ("+state.comments[i]+")";
        return "Q"+(i+1)+"="+a;
      }).join("; "),
      remarks: document.getElementById("remarks").value.trim()
    });
    localStorage.setItem("shine_log", JSON.stringify(log));
  }catch(_){}
  document.getElementById("reportOut").textContent = report;
  lastShare = { report: report, subject: subject,
                files: state.photos.map(function(p){return p.file;}).concat(state.docs) };
  go("done");
  await sendShare();
};

async function sendShare(){
  if (!lastShare) return;
  var report = lastShare.report, subject = lastShare.subject, files = lastShare.files;
  var doneMsg = document.getElementById("doneMsg");
  if (files.length && navigator.canShare && navigator.canShare({files: files})){
    doneMsg.textContent = "Your phone's share menu opened - choose your email or Teams app and send to " + CONFIG.emailTo + ". Report and attachments are included.";
    try{ await navigator.share({title:subject, text:"Send this report to: " + CONFIG.emailTo + "\n\n" + report, files:files}); }catch(_){}
  } else if (!files.length && navigator.share){
    doneMsg.textContent = "Your phone's share menu opened - choose your email or Teams app and send to " + CONFIG.emailTo + ".";
    try{ await navigator.share({title:subject, text:report}); }catch(_){}
  } else {
    doneMsg.textContent = files.length
      ? "Email draft opened with the report text. Attachments can't attach automatically on this device - they've been downloaded, please attach them to the email before sending."
      : "Email draft opened with the report text - just press Send.";
    files.forEach(function(f,i){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(f);
      a.download = f.name || ("attachment_"+(i+1));
      a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);}, 5000);
    });
    location.href = "mailto:" + encodeURIComponent(CONFIG.emailTo) +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(report);
  }
}
document.getElementById("shareAgainBtn").onclick = sendShare;

document.getElementById("copyBtn").onclick = async function(e){
  try{
    await navigator.clipboard.writeText(document.getElementById("reportOut").textContent);
    e.target.textContent = "Copied ✓";
    setTimeout(function(){e.target.textContent="Copy report text";},1500);
  }catch(_){ e.target.textContent = "Select & copy the text above"; }
};

/* entries */
function getLog(){
  try{ return JSON.parse(localStorage.getItem("shine_log")||"[]"); }catch(_){ return []; }
}
function renderEntries(){
  var list = document.getElementById("entryList");
  list.innerHTML = "";
  var today = new Date().toDateString();
  var todays = getLog().filter(function(e){return new Date(e.t).toDateString() === today;}).reverse();
  if (!todays.length){
    list.innerHTML = '<div class="empty">No entries submitted from this device today.</div>';
    return;
  }
  todays.forEach(function(e){
    var d = document.createElement("div");
    d.className = "card entry";
    d.innerHTML = '<div class="e1"></div><div class="e2"></div>';
    d.querySelector(".e1").textContent = e.cat + " · " + e.area;
    d.querySelector(".e2").textContent = new Date(e.t).toLocaleTimeString() + " · Emp " + e.emp +
      " · " + e.no + " issue(s) · " + e.photos + " photo(s)";
    list.appendChild(d);
  });
}

/* dashboard */
function renderDash(){
  var today = new Date().toDateString();
  document.getElementById("dashDate").textContent =
    new Date().toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"});
  var todays = getLog().filter(function(e){return new Date(e.t).toDateString() === today;});
  var grid = document.getElementById("dashGrid");
  grid.innerHTML = "";
  CONFIG.areas.forEach(function(a){
    var hits = todays.filter(function(e){return e.area === a;});
    var t = document.createElement("div");
    t.className = "dtile " + (hits.length ? "ok" : "miss");
    var s = document.createElement("small");
    s.textContent = hits.length ? (hits.length + " check(s) today") : "Not checked yet";
    t.textContent = a;
    t.appendChild(s);
    grid.appendChild(t);
  });
  var lg = document.getElementById("dashLog");
  lg.innerHTML = "";
  var recent = getLog().slice(-30).reverse();
  if (!recent.length){
    lg.innerHTML = '<div class="empty">No submissions logged on this device yet.</div>';
  } else {
    recent.forEach(function(e){
      var d = document.createElement("div");
      d.className = "card entry";
      d.innerHTML = '<div class="e1"></div><div class="e2"></div>';
      d.querySelector(".e1").textContent = e.cat + " · " + e.area;
      d.querySelector(".e2").textContent = new Date(e.t).toLocaleString() + " · Emp " + e.emp +
        " · " + e.shift + " · " + e.no + " issue(s)";
      lg.appendChild(d);
    });
  }
}
document.getElementById("csvBtn").onclick = function(){
  function esc(v){ return '"' + String(v===undefined||v===null?"":v).replace(/"/g,'""') + '"'; }
  var rows = [["Date","Time","Category","Area","EmployeeID","Shift","Issues","Answers","Remarks"].map(esc).join(",")];
  getLog().forEach(function(e){
    var d = new Date(e.t);
    rows.push([d.toLocaleDateString(), d.toLocaleTimeString(), e.cat, e.area, e.emp,
               e.shift||"", e.no, e.ans||"", e.remarks||""].map(esc).join(","));
  });
  var blob = new Blob(["\uFEFF" + rows.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shine_log.csv";
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);}, 5000);
};
